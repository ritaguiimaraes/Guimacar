        /* Filtros (nova caixa) */
        .filter-chip {

        }

        .filter-chip select {
            position: absolute;
            opacity: 0;
            pointer-events: none;
            height: 0;
            width: 0;
        }

        .chip-button {
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            color: #f3f4f6;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 999px;
            padding: 10px 38px 10px 18px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            transition: border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease, color 0.2s ease;
            text-align: left;
        }

        .chip-button span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .chip-button:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .filter-chip.open .chip-button {
            border-color: #f97316;
            box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.25);
        }

        .chip-button.active {
            border-color: #f97316;
            background: rgba(249, 115, 22, 0.12);
            color: #fb923c;
        }

        .chip-arrow {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            font-size: 11px;
            color: #9ca3af;
            transition: transform 0.2s ease, color 0.2s ease;
        }

        .filter-chip.open .chip-arrow {
            transform: translateY(-50%) rotate(180deg);
            color: #f97316;
        }

        .chip-options {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            right: 0;
            background: #161616;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            box-shadow: 0 25px 60px -20px rgba(0, 0, 0, 0.6);
            padding: 6px;
            z-index: 60;
            display: none;
            max-height: 260px;
            overflow-y: auto;
        }

        .filter-chip.open {
            z-index: 60;
        }

        #filtros-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(2px);
            z-index: 25;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        #filtros-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .filter-chip.open .chip-options {
            display: block;
        }

        .chip-option {
            padding: 9px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            color: #d1d5db;
            cursor: pointer;
            transition: background 0.15s ease, color 0.15s ease;
        }

        .chip-option:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
        }

        .chip-option.is-active {
            background: rgba(249, 115, 22, 0.15);
            color: #fb923c;
        }

        .reveal-card {
            animation: cardIn 0.7s ease-out both;
        }
        .card-fade-in {

        }

        @keyframes cardIn {
            0% { opacity: 0; transform: translateY(14px) scale(0.98); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

    <script>
        function voltarPagina() {
            window.location.href = './';
        }

        const gridCarros = document.getElementById('grid-carros');
        let filteredCars = [];
        
        // Ordenar carros por ID decrescente (mais recentes primeiro)
        const sortedCars = [...stockGuimacar].sort((a, b) => b.id - a.id);
        filteredCars = sortedCars;
        
        // Estado dos filtros
        const filters = {
            combustivel: 'Todos',
            kms: 'Todos',
            ano: 'Todos',
            preco: 'Todos'
        };

        // Função para extrair valor numérico do preço
        function extractPrice(priceString) {
            return parseInt(priceString.replace(/[^\d]/g, ''));
        }

        // Função para extrair ano do mês
        function extractYear(mesString) {
            const yearMatch = mesString.match(/\d{4}/);
            return yearMatch ? parseInt(yearMatch[0]) : 0;
        }

        // Função para extrair valor numérico dos kms
        function extractKms(kmsString) {
            return parseInt(kmsString.replace(/[^\d]/g, ''));
        }

        // Função para aplicar filtros
        function applyFilters() {
            filteredCars = sortedCars.filter(carro => {
                // Filtro de combustível
                if (filters.combustivel !== 'Todos' && carro.combustivel !== filters.combustivel) {
                    return false;
                }

                // Filtro de quilómetros
                if (filters.kms !== 'Todos') {
                    const kms = extractKms(carro.kms);
                    switch (filters.kms) {
                        case '0-50000':
                            if (kms > 50000) return false;
                            break;
                        case '50000-100000':
                            if (kms < 50000 || kms > 100000) return false;
                            break;
                        case '100000-150000':
                            if (kms < 100000 || kms > 150000) return false;
                            break;
                        case '150000+':
                            if (kms < 150000) return false;
                            break;
                    }
                }

                // Filtro de ano
                if (filters.ano !== 'Todos') {
                    const year = extractYear(carro.mes);
                    switch (filters.ano) {
                        case '2020+':
                            if (year < 2020) return false;
                            break;
                        case '2018-2020':
                            if (year < 2018 || year > 2020) return false;
                            break;
                        case '2015-2018':
                            if (year < 2015 || year > 2018) return false;
                            break;
                        case 'antes-2015':
                            if (year >= 2015) return false;
                            break;
                    }
                }


            
                // Filtro de preço
                // Filtro de preço
                if (filters.preco !== 'Todos') {
                    // Se for Sob Consulta, esconde logo o carro sem precisar de extrair número nenhum
                    if (carro.preco === "Sob Consulta") return false;

                    const price = extractPrice(carro.preco);
                    switch (filters.preco) {
                        case '0-5000':
                            if (price > 5000) return false;
                            break;
                        case '5000-10000':
                            if (price < 5000 || price > 10000) return false;
                            break;
                        case '10000-15000':
                            if (price < 10000 || price > 15000) return false;
                            break;
                        case '15000-20000':
                            if (price < 15000 || price > 20000) return false;
                            break;
                        case '20000+':
                            if (price < 20000) return false;
                            break;
                    }
                }

                return true;
            });

            // Reset para primeira página
            renderPage(1);
            updateResultsCount();

        document.querySelectorAll('.filter-select').forEach(select => {
            select.classList.toggle('active', select.value !== 'Todos');
        });
        }

        // Função para atualizar contador de resultados
        function updateResultsCount() {
            document.getElementById('results-count').textContent = filteredCars.length;
        }

        // Event listeners para filtros
        document.querySelectorAll('.filter-select').forEach(select => {
            select.addEventListener('change', function() {
                const filterType = this.dataset.filter;
                const filterValue = this.value;

                this.classList.toggle('active', this.value !== 'Todos');

                // Atualiza o filtro
                filters[filterType] = filterValue;

                applyFilters();
            });
        });

        // Botão limpar filtros
        document.getElementById('clear-filters').addEventListener('click', function() {
            // Reset todos os filtros
            Object.keys(filters).forEach(key => {
                filters[key] = 'Todos';
            });

            // Reset selects
            document.querySelectorAll('.filter-select').forEach(select => {
                select.value = 'Todos';
                select.classList.remove('active');
            });

            applyFilters();
        });

        function renderPage(page) {
            const carsToShow = filteredCars;
            
            gridCarros.innerHTML = '';

            if (carsToShow.length === 0) {
                gridCarros.innerHTML = `
                    <div class="col-span-full flex flex-col items-center justify-center py-24 text-center">
                        <i class="fas fa-car text-orange-500/30 text-6xl mb-6"></i>
                        <p class="text-white text-2xl font-black mb-2">Nenhuma viatura encontrada</p>
                        <p class="text-gray-400 text-sm">Tenta ajustar os filtros para ver mais resultados.</p>
                    </div>
                `;
                return;
            }
            
            carsToShow.forEach((carro, idx) => {
                const card = document.createElement('div');
                card.className = `bg-white rounded-[2rem] overflow-hidden origin-center shadow-[0_35px_90px_-35px_rgba(249,115,22,0.55)] relative transition-all duration-300 transform hover:scale-105 hover:shadow-[0_55px_140px_-40px_rgba(249,115,22,0.6)] border border-gray-200 w-full max-w-[400px] card-fade-in group ${carro.brevemente ? 'cursor-default' : 'cursor-pointer'}`;
                card.style.animationDelay = `${Math.min(idx * 0.05, 0.3)}s`;
                
                card.innerHTML = `
                    <div class="p-3">
                        ${carro.destaque ? `<span class="absolute top-4 left-4 z-10 bg-lime-500 text-black text-[10px] font-black uppercase tracking-wider px-2.5 py-1 rounded-full">Destaque</span>` : ''}
                        <div class="relative h-60 w-full overflow-hidden origin-center rounded-2xl shadow-sm">
                            ${!carro.brevemente ? `<span class="absolute top-4 right-4 z-10 bg-black/70 text-white text-[10px] font-bold uppercase tracking-wider px-2.5 py-1 rounded-full opacity-0 transition-opacity duration-200 card-tip group-hover:opacity-100">Ver detalhes</span>` : ''}
                            <img src="${carro.fotos && carro.fotos.length > 0 ? carro.fotos[0] : 'img/inicio.jpg'}" class="w-full h-full object-cover ${carro.brevemente ? 'brightness-[0.35]' : ''}" alt="${carro.marca} ${carro.modelo}" loading="lazy">
                            ${carro.brevemente ? `
                            <div class="absolute inset-0 flex flex-col items-center justify-center gap-2">
                                <span class="text-white text-2xl font-black uppercase tracking-[0.2em]">Brevemente</span>
                                <span class="w-10 h-0.5 bg-orange-500 rounded-full"></span>
                                <span class="text-orange-500 text-[11px] font-bold uppercase tracking-widest">Em breve disponível</span>
                            </div>` : `
                            <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-transparent to-transparent">
                                <div class="absolute bottom-3 left-0 right-0 px-4 flex justify-between text-white text-[10px] font-bold uppercase tracking-wider">
                                    <span><i class="fas fa-calendar-alt mr-1 text-lime-500"></i>${extractYear(carro.mes)}</span>
                                    <span><i class="fas fa-gas-pump mr-1 text-lime-500"></i>${carro.combustivel}</span>
                                    <span><i class="fas fa-road mr-1 text-lime-500"></i>${carro.kms}</span>
                                </div>
                            </div>`}
                        </div>
                    </div>
                    <div class="px-6 pt-2 pb-3 -mt-1">
                        <h3 class="text-3xl font-black text-slate-900 leading-tight">${carro.marca}</h3>
                        <p class="text-slate-800 sm:text-slate-700 text-sm mb-4 font-medium">${carro.modelo}</p>
                        <div class="flex items-end justify-between border-t-2 border-orange-400/60 pt-2 -mt-1">
                            <div>
                                ${carro.brevemente
                                    ? `<p class="text-xl font-black text-slate-400 uppercase tracking-wider">Sob Consulta</p>`
                                    : `<p class="text-3xl font-black text-lime-500">${carro.preco}</p>`}
                                ${carro.ivaDedutivel && !carro.brevemente ? `<p class="text-orange-500 text-[11px] font-bold uppercase tracking-wider mt-0.5"><i class="fas fa-check mr-1"></i>IVA Dedutível</p>` : ''}
                            </div>
                            ${carro.reservado && !carro.brevemente ? `<span class="text-orange-500 text-lg font-black uppercase">Reservado</span>` : ''}
                        </div>
                    </div>
                `;

                // Hover: cycle through photos of the same car
                const imgEl = card.querySelector('img');
                let hoverInterval = null;
                let hoverIndex = 0;

                card.addEventListener('mouseenter', () => {
                    if (!carro.fotos || carro.fotos.length < 2 || !imgEl) return;
                    hoverIndex = 0;
                    hoverInterval = setInterval(() => {
                        hoverIndex = (hoverIndex + 1) % carro.fotos.length;
                        imgEl.src = carro.fotos[hoverIndex];
                    }, 900);
                });

                card.addEventListener('mouseleave', () => {
                    if (hoverInterval) {
                        clearInterval(hoverInterval);
                        hoverInterval = null;
                    }
                    if (imgEl) {
                        imgEl.src = carro.fotos && carro.fotos.length > 0 ? carro.fotos[0] : 'img/inicio.jpg';
                    }
                });

                // Touch: arrastar o dedo sobre a foto para trocar (mobile)
                let touchPhotoIndex = 0;
                let touchStartX = 0;
                let touchStartY = 0;
                let isDraggingPhoto = false;

                if (imgEl) {
                    imgEl.addEventListener('touchstart', (e) => {
                        if (!carro.fotos || carro.fotos.length < 2) return;
                        touchStartX = e.touches[0].clientX;
                        touchStartY = e.touches[0].clientY;
                        isDraggingPhoto = false;
                    }, { passive: true });

                    imgEl.addEventListener('touchmove', (e) => {
                        if (!carro.fotos || carro.fotos.length < 2) return;
                        const touch = e.touches[0];
                        const dx = touch.clientX - touchStartX;
                        const dy = touch.clientY - touchStartY;

                        if (!isDraggingPhoto) {
                            if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
                            if (Math.abs(dy) > Math.abs(dx)) return; // é scroll vertical da página, ignora
                            isDraggingPhoto = true;
                        }

                        e.preventDefault();
                        const rect = imgEl.getBoundingClientRect();
                        const relativeX = Math.min(Math.max(touch.clientX - rect.left, 0), rect.width);
                        const idx = Math.min(
                            carro.fotos.length - 1,
                            Math.floor((relativeX / rect.width) * carro.fotos.length)
                        );
                        if (idx !== touchPhotoIndex) {
                            touchPhotoIndex = idx;
                            imgEl.src = carro.fotos[idx];
                        }
                    }, { passive: false });

                    imgEl.addEventListener('touchend', () => {
                        if (isDraggingPhoto) {
                            touchPhotoIndex = 0;
                            imgEl.src = carro.fotos && carro.fotos.length > 0 ? carro.fotos[0] : 'img/inicio.jpg';
                        }
                        isDraggingPhoto = false;
                    }, { passive: true });
                }

                card.onclick = function() {
                    if (carro.brevemente) return;
                    window.location.href = `detalhes?id=${carro.id}`;
                };

                gridCarros.appendChild(card);
            });
            
            renderPagination();
        }

        function renderPagination() {
            document.getElementById('pagination').innerHTML = '';
        }



        // Renderizar primeira página
        renderPage(1);
        updateResultsCount();

        document.querySelectorAll('.filter-select').forEach(select => {
            select.classList.toggle('active', select.value !== 'Todos');
        });
    </script>

    <script>
        (function() {
            function buildDropdown(select) {
                const wrapper = select.closest('.filter-chip');
                if (!wrapper) return;

                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'chip-button';
                button.innerHTML = `
                    <span>${select.options[select.selectedIndex]?.text || ''}</span>
                    <i class="fas fa-chevron-down chip-arrow"></i>
                `;

                const optionsList = document.createElement('div');
                optionsList.className = 'chip-options';

                Array.from(select.options).forEach(opt => {
                    const optEl = document.createElement('div');
                    optEl.className = 'chip-option';
                    optEl.dataset.value = opt.value;
                    optEl.textContent = opt.text;
                    if (opt.selected) optEl.classList.add('is-active');
                    optionsList.appendChild(optEl);
                });

                wrapper.appendChild(button);
                wrapper.appendChild(optionsList);

                function refresh() {
                    const label = button.querySelector('span');
                    label.textContent = select.options[select.selectedIndex]?.text || '';
                    button.classList.toggle('active', select.value !== 'Todos');
                    optionsList.querySelectorAll('.chip-option').forEach(opt => {
                        opt.classList.toggle('is-active', opt.dataset.value === select.value);
                    });
                }

                button.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const wasOpen = wrapper.classList.contains('open');
                    document.querySelectorAll('.filter-chip.open').forEach(el => el.classList.remove('open'));
                    if (!wasOpen) {
                        wrapper.classList.add('open');
                    }
                    updateOverlay();
                });

                optionsList.addEventListener('click', (e) => {
                    const target = e.target.closest('.chip-option');
                    if (!target) return;
                    select.value = target.dataset.value;
                    select.dispatchEvent(new Event('change', { bubbles: true }));
                    wrapper.classList.remove('open');
                    updateOverlay();
                });

                select.addEventListener('change', refresh);
                refresh();
            }

            function updateOverlay() {
                const overlay = document.getElementById('filtros-overlay');
                if (!overlay) return;
                const anyOpen = document.querySelector('.filter-chip.open');
                overlay.classList.toggle('show', !!anyOpen);
            }

            document.querySelectorAll('.filter-select').forEach(buildDropdown);

            document.addEventListener('click', () => {
                document.querySelectorAll('.filter-chip.open').forEach(el => el.classList.remove('open'));
                updateOverlay();
            });

            const filtrosOverlay = document.getElementById('filtros-overlay');
            if (filtrosOverlay) {
                filtrosOverlay.addEventListener('click', () => {
                    document.querySelectorAll('.filter-chip.open').forEach(el => el.classList.remove('open'));
                    updateOverlay();
                });
            }

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    document.querySelectorAll('.filter-chip.open').forEach(el => el.classList.remove('open'));
                    updateOverlay();
                }
            });
        })();
    </script>

    <!-- Separador visual -->
    <div class="relative h-px w-full bg-white/5">
        <div class="absolute inset-0 bg-gradient-to-r from-transparent via-orange-500/40 to-transparent shadow-[0_0_15px_rgba(249,115,22,0.3)]"></div>
    </div>
    <div id="footer-placeholder"></div>
    <script>
        fetch('footer')
            .then(res => res.text())
            .then(html => { document.getElementById('footer-placeholder').innerHTML = html; })
            .catch(err => console.error('Erro ao carregar o footer:', err));
    </script>
    <script>
        (function() {
            const mobileMenu = document.getElementById('mobile-menu');
            const overlay = document.getElementById('menu-overlay');
            const openBtn = document.getElementById('open-menu-header');
            const closeBtn = document.getElementById('close-menu');

            function openMenu() {
                mobileMenu.classList.remove('translate-x-full');
                overlay.classList.remove('hidden');
                document.body.style.overflow = 'hidden';
            }
            function closeMenu() {
                mobileMenu.classList.add('translate-x-full');
                overlay.classList.add('hidden');
                document.body.style.overflow = '';
            }

            openBtn?.addEventListener('click', openMenu);
            closeBtn?.addEventListener('click', closeMenu);
            overlay?.addEventListener('click', closeMenu);
        })();
    </script>

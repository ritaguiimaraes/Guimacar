<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página não encontrada | Guimacar</title>
    <meta name="robots" content="noindex, follow">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #000000; }
        ::-webkit-scrollbar-thumb { background: #f97316; border-radius: 999px; }
        ::-webkit-scrollbar-thumb:hover { background: #fb923c; }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
        }
        .float { animation: float 3.5s ease-in-out infinite; }

        @keyframes glitch {
            0%, 100% { text-shadow: 0 0 40px rgba(249,115,22,0.6); }
            25% { text-shadow: -3px 0 0 rgba(249,115,22,0.8), 3px 0 0 rgba(255,255,255,0.2); }
            75% { text-shadow: 3px 0 0 rgba(249,115,22,0.8), -3px 0 0 rgba(255,255,255,0.2); }
        }
        .glitch { animation: glitch 2.5s ease-in-out infinite; }

        .cta-btn {
            position: relative;
            overflow: hidden;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease;
        }
        .cta-btn::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 60%;
            height: 100%;
            background: linear-gradient(120deg, transparent, rgba(255,255,255,0.25), transparent);
            transform: skewX(-20deg);
            transition: left 0.5s ease;
        }
        .cta-btn:hover::after { left: 160%; }
        .cta-btn:hover {
            transform: scale(1.06) translateY(-2px);
            box-shadow: 0 0 32px rgba(249,115,22,0.55);
        }
        .cta-btn:active { transform: scale(0.97); }
    </style>
</head>
<body class="bg-black font-sans text-gray-100 min-h-screen flex flex-col selection:bg-orange-500 selection:text-white">

    <!-- Header -->
    <header style="background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(249,115,22,0.6); box-shadow: 0 18px 50px -18px rgba(249,115,22,0.7);">
        <div class="container mx-auto px-6 py-4">
            <a href="/" class="text-2xl font-black tracking-tighter">
                <span class="text-white">GUIMA</span><span class="text-orange-500">CAR</span>
            </a>
        </div>
    </header>

    <!-- Conteúdo -->
    <main class="flex-1 flex items-center justify-center px-4 py-16">
        <div class="text-center max-w-lg">

            <!-- Ícone flutuante -->
            <div class="float mb-8">
                <i class="fas fa-car text-orange-500/20 text-8xl md:text-9xl"></i>
            </div>

            <!-- 404 -->
            <h1 class="glitch text-[8rem] md:text-[12rem] font-black text-orange-500 leading-none tracking-tighter">
                404
            </h1>

            <h2 class="text-2xl md:text-3xl font-black text-white uppercase italic tracking-tight mt-2 mb-4">
                Página não encontrada
            </h2>

            <p class="text-gray-400 text-base md:text-lg mb-10 leading-relaxed">
                A página que procura não existe ou foi movida.<br>
                Mas temos ótimas viaturas à sua espera!
            </p>

            <!-- Botões -->
            <div class="flex flex-col sm:flex-row gap-4 justify-center">
                <a href="/" class="cta-btn bg-orange-500 hover:bg-orange-600 text-white px-8 py-4 rounded-full font-black text-sm uppercase tracking-widest inline-flex items-center justify-center gap-2">
                    <i class="fas fa-home"></i> Página Inicial
                </a>
                <a href="stock" class="cta-btn bg-white/5 hover:bg-white/10 border border-white/10 hover:border-orange-500/40 text-white px-8 py-4 rounded-full font-black text-sm uppercase tracking-widest inline-flex items-center justify-center gap-2">
                    <i class="fas fa-car text-orange-500"></i> Ver Viaturas
                </a>
            </div>

            <!-- Contacto -->
            <p class="text-gray-500 text-sm mt-12">
                Precisa de ajuda?
                <a href="contacto" class="text-orange-500 hover:underline font-bold ml-1">Contacte-nos</a>
            </p>

        </div>
    </main>

    <!-- Footer -->
     <div class="relative h-px w-full bg-white/5">
        <div class="absolute inset-0 bg-gradient-to-r from-transparent via-orange-500/40 to-transparent shadow-[0_0_15px_rgba(249,115,22,0.3)]"></div>
    </div>
    <div id="footer-placeholder"></div>
    <script>
        fetch('footer.html')
            .then(res => res.text())
            .then(html => { document.getElementById('footer-placeholder').innerHTML = html; })
            .catch(err => console.error('Erro ao carregar o footer:', err));
    </script>
</body>
</html>
